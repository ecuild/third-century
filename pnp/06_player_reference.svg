<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1180" viewBox="0 0 840 1180" font-family="'Noto Serif CJK SC','Songti SC','SimSun','Times New Roman',serif">
<rect x="0" y="0" width="840" height="1180" fill="#f3e9d2" stroke="#9c7a1e" stroke-width="3"/><rect x="14" y="14" width="812" height="1152" rx="8" fill="none" stroke="#c9a227" stroke-width="1.5"/><text x="420.0" y="50" font-size="26" font-weight="800" fill="#2b2118" text-anchor="middle">玩家速查 · 三世纪：罗马的黄昏</text><line x1="40" y1="66" x2="800" y2="66" stroke="#c9a227" stroke-width="1.5"/><text x="40" y="90" font-size="16" font-weight="800" fill="#9c7a1e">① 座次环（双线闭环）</text><text x="40" y="112" font-size="13" fill="#2b2118">1卡劳修斯 2克罗库斯 3奥勒良</text><text x="40" y="131" font-size="13" fill="#2b2118">4尼瓦 5沙普尔 6芝诺比娅</text><text x="40" y="150" font-size="13" fill="#2b2118">7巴高达 8波斯图穆斯（8↔1闭合）</text><text x="40" y="169" font-size="13" fill="#2b2118">每人镇守左右 2 条战线。</text><text x="40" y="202" font-size="16" font-weight="800" fill="#9c7a1e">② 出牌流程</text><text x="40" y="224" font-size="13" fill="#2b2118">1. 选线：你的 2 条线各扣 1 张，选哪条由你定。</text><text x="40" y="243" font-size="13" fill="#2b2118">2. 选格：该线一个未决出的旗幟格。</text><text x="40" y="262" font-size="13" fill="#2b2118">3. 扣牌：从该线手牌选 1 张面朝下放入。</text><text x="40" y="281" font-size="13" fill="#2b2118">4. 扣完→自标记起按方向指示器摊开(每回合翻面)</text><text x="40" y="300" font-size="13" fill="#2b2118">5. 每格最多 3 张（比阵型大小）。</text><text x="40" y="319" font-size="13" fill="#2b2118">6. 结算后从该线牌堆补 1 张。</text><text x="40" y="338" font-size="13" fill="#2b2118">7. 战场标记每回合逆时针迁移 1 格。</text><text x="40" y="371" font-size="16" font-weight="800" fill="#b5462f">②b 双线手牌（关键）</text><text x="40" y="393" font-size="13" fill="#2b2118">每条战线各 7 张，共 14 张。</text><text x="40" y="412" font-size="13" fill="#2b2118">两线手牌独立，绝不混用：</text><text x="40" y="431" font-size="13" fill="#2b2118">补牌只补本线；出牌只出本线。</text><text x="40" y="450" font-size="13" fill="#2b2118">某线手牌为 0 → 该线触发领袖放置，</text><text x="40" y="469" font-size="13" fill="#2b2118">另一线照常暗扣。</text><text x="40" y="488" font-size="13" fill="#2b2118">战术牌单独放，不占手牌位。</text><text x="40" y="507" font-size="13" fill="#2b2118">★ 暗扣同时进行，对手看不到你选哪</text><text x="40" y="526" font-size="13" fill="#2b2118">条线——「选线」就是本作的核心博弈。</text><text x="40" y="559" font-size="16" font-weight="800" fill="#9c7a1e">③ 阵型排序（高→低）</text><text x="40" y="581" font-size="13" fill="#2b2118">同花顺(三同花连号) > 方阵(三同点)</text><text x="40" y="600" font-size="13" fill="#2b2118">> 同花(三同花) > 顺子(三连号)</text><text x="40" y="619" font-size="13" fill="#2b2118">> 杂军(其余)。</text><text x="40" y="638" font-size="13" fill="#2b2118">平手：后出牌者负（兵贵神速）。</text><text x="40" y="657" font-size="13" fill="#2b2118">夺旗严格零和：无无人旗，夺者+1、原主必−1。</text><text x="440" y="90" font-size="16" font-weight="800" fill="#9c7a1e">④ 中心区域（6 色 = 6 势力）</text><text x="440" y="112" font-size="13" fill="#2b2118">紫元老院 红禁卫军 蓝宫廷近臣</text><text x="440" y="131" font-size="13" fill="#2b2118">橙财政使 绿意大利城市 黄北非粮仓</text><text x="440" y="150" font-size="13" fill="#2b2118">打出某色牌 → 二选一：</text><text x="440" y="169" font-size="13" fill="#2b2118">  A. 在该色区放 1 影响力标记</text><text x="440" y="188" font-size="13" fill="#2b2118">  B. 移动领袖（规则见下）</text><text x="440" y="207" font-size="13" fill="#2b2118">领袖在该色区→可移任意区；</text><text x="440" y="226" font-size="13" fill="#2b2118">不在→移入该色区。</text><text x="440" y="245" font-size="13" fill="#2b2118">回合末最高色=主导花色（并列则无主导花色）</text><text x="440" y="264" font-size="13" fill="#2b2118">某区影响力≥6 且唯一第一→夺其战术牌。</text><text x="440" y="283" font-size="13" fill="#2b2118">中央区第一 +1 分；易主 ±1，可反复易主。</text><text x="440" y="316" font-size="16" font-weight="800" fill="#9c7a1e">⑤ 战术牌分类</text><text x="440" y="338" font-size="13" fill="#2b2118">士气(红)×4：作阵型一张牌参与比较</text><text x="440" y="357" font-size="13" fill="#2b2118">  领袖×2=万能牌；御林铁骑=任花色8；</text><text x="440" y="376" font-size="13" fill="#2b2118">  戍边军团=任花色≤3。</text><text x="440" y="395" font-size="13" fill="#2b2118">环境(绿)×2：置于未夺旗旁改比较方式</text><text x="440" y="414" font-size="13" fill="#2b2118">  瘟疫=只比点数和；春汛=四张阵型。</text><text x="440" y="433" font-size="13" fill="#2b2118">计谋(蓝)×4：落场持久·可被夺取</text><text x="440" y="452" font-size="13" fill="#2b2118">  哥特游骑/莱茵换防/军团哗变/附庸倒戈;</text><text x="440" y="471" font-size="13" fill="#2b2118">  虚空站位不占格位；被超越→夺牌+回滚,</text><text x="440" y="490" font-size="13" fill="#2b2118">  原格位已被占满则该牌不回归。</text><text x="440" y="509" font-size="13" fill="#2b2118">库共 10 张，开局 6 色区各随机 1 张。</text><text x="440" y="528" font-size="13" fill="#2b2118">战术牌单独存放，不占两线手牌位；</text><text x="440" y="547" font-size="13" fill="#2b2118">可在任一参与战线打出（每线不超对手+1）。</text><line x1="40" y1="1060" x2="800" y2="1060" stroke="#c9a227" stroke-width="1.5"/><text x="40" y="1076" font-size="16" font-weight="800" fill="#b5462f">⑥ 终局与胜负</text><text x="40" y="1098" font-size="13" fill="#2b2118">不设即胜。终局：① 任一玩家旗子数达 12</text><text x="40" y="1117" font-size="13" fill="#2b2118">（旗子数＝累计夺旗＋当前持有中央区）；</text><text x="40" y="1136" font-size="13" fill="#2b2118">② 牌堆耗尽并二次洗回再用尽；③ 全员同意。</text><text x="40" y="1155" font-size="13" fill="#2b2118">终局后总分最高者胜；同分比旗子数、再比中央区。</text><text x="40" y="1174" font-size="13" fill="#2b2118">总分=Σ战线(夺旗−失旗)+中央区占位分；夺旗+1/原主−1。</text><text x="40" y="1193" font-size="13" fill="#2b2118">主导花色对已分出胜负的战线不再影响。</text>
</svg>
